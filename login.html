<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Login | Afrodita Belleza</title>

    <!-- CSS -->
    <link rel="stylesheet" href="assets/styles.css" />
    <link rel="stylesheet" href="assets/login.css" />
  </head>
  <body>
    <div class="login-container">
      <!-- LADO IZQUIERDO -->
      <section class="login-left">
        <div class="overlay">
          <img
            src="assets/images/logo.jpeg"
            alt="Afrodita Belleza"
            class="logo"
          />

          <div class="logo-wrapper">
            <img
              src="assets/images/logo.jpeg"
              alt="Afrodita Belleza"
              class="logo"
            />
          </div>

          <h2>Tu sistema POS de belleza</h2>

          <div class="stats">
            <div>
              <strong>500+</strong>
              <span>Productos</span>
            </div>
            <div>
              <strong>50+</strong>
              <span>Proveedores</span>
            </div>
            <div>
              <strong>99%</strong>
              <span>Satisfacción</span>
            </div>
          </div>
        </div>
      </section>

      <!-- LADO DERECHO -->
      <section class="login-right">
        <div class="login-card">
          <h1>¡Bienvenida de vuelta!</h1>
          <p>Inicia sesión para continuar</p>

          <form id="loginForm">
            <label for="email">Correo Electrónico</label>
            <input
              id="email"
              type="email"
              placeholder="tu@email.com"
              required
            />

            <label for="password">Contraseña</label>
            <input
              id="password"
              type="password"
              placeholder="••••••••"
              required
            />

            <div class="options">
              <label>
                <input type="checkbox" />
                Recordarme
              </label>
              <a href="#">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit">Iniciar Sesión</button>
          </form>

          <p class="admin">
            ¿No tienes cuenta?
            <a href="#">Contacta al administrador</a>
          </p>

          <a class="back" href="index.html">← Volver al inicio</a>
        </div>
      </section>
    </div>

    <!-- JS -->
    <script src="assets/login.js"></script>
  </body>
</html>
